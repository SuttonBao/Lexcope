name: Lexcope V1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: Scripts/test.sh
      - name: SwiftUI type check and model integration
        run: Scripts/check_ui.sh
      - name: Reproducible content and project
        run: |
          python3 Scripts/build_vocabulary.py
          python3 Scripts/generate_project.py
          git diff --exit-code
          plutil -lint Lexcope.xcodeproj/project.pbxproj App/PrivacyInfo.xcprivacy
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS app
        run: |
          xcodebuild -project Lexcope.xcodeproj -scheme Lexcope -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LexcopeDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP'])/'devices.json').read_text())['devices']
          phones = [d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not phones:
              raise SystemExit('No available iPhone simulator runtime')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"LEXCOPE_SIMULATOR={phones[0]['udid']}\n")
          PY
      - name: UI smoke test on iPhone
        run: |
          xcodebuild -project Lexcope.xcodeproj -scheme Lexcope -configuration Debug \
            -destination "platform=iOS Simulator,id=$LEXCOPE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/LexcopeDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/LexcopeUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/LexcopeUITests.xcresult
          if-no-files-found: ignore
